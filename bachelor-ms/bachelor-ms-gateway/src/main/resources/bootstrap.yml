spring:
  profiles:
    active: dev
  application:
    name: bachelor-ms-gateway
    workbench-code: workbench-manage
  cloud:
    gateway:
      defaultFilters:
      - name: Retry
        args:
          retries: 3
          statuses: BAD_GATEWAY
      - name: RequestRateLimiter
        args:
#          keyResolver: '#{@tokenKeyResolver}'
          in-memory-rate-limiter:
            replenish-rate: 10000
            burst-capacity: 2000
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
    config:
      enabled: true
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yaml
        group: ${spring.profiles.active}_GROUP
        data-id: ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  messages:
    basename: i18n/messages


#    config:
#      name: gateway
#      profile: dev
#      label: master
#      discovery:
#        enabled: true
#        service-id: config-service

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # maxFileSize 单个数据大小
      maxFileSize: 30MB
      # maxRequestSize 是总数据大小
      maxRequestSize: 100MB
  config:
    import:
      - "optional:nacos:${spring.application.name}"
server:
  port: 8899
#  connection-timeout: 1000
feign:
  hystrix:
    enabled: true
#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:8740/eureka
#  instance:
#    prefer-ip-address: true
#    instance-id: ${spring.cloud.client.ip-address}:${server.port}
#    metadata-map:
#      swagger-hidden: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
info:
  app:
    name: '服务网关'
    version: '@project.version@'
swagger:
  base-package: ["cn.org.bachelor.ms.gateway.controller","cn.org.bachelor.ms.gateway.filter"]
  title: "服务网关的Restful API"
  version: "1.0"
  description: "服务网关API 描述"
