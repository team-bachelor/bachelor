spring:
  main:
    web-application-type: reactive
  profiles:
    active: local
  application:
    name: bachelor-ms-gateway
    workbench-code: workbench-manage
  cloud:
    gateway:
      defaultFilters:
      - name: Retry
        args:
          retries: 3
          statuses: BAD_GATEWAY
      - name: RequestRateLimiter
        args:
          in-memory-rate-limiter:
            replenish-rate: 10000
            burst-capacity: 2000
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
#    config:
#      enabled: true
  messages:
    basename: i18n/messages
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # maxFileSize 单个数据大小
      maxFileSize: 30MB
      # maxRequestSize 是总数据大小
      maxRequestSize: 100MB
  config:
    import:
      - "optional:nacos:${spring.application.name}"
server:
  port: 8899
feign:
  hystrix:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
info:
  app:
    name: '服务网关'
    version: '@project.version@'
swagger:
  base-package: ["cn.org.bachelor.ms.gateway.controller","cn.org.bachelor.ms.gateway.filter"]
  title: "服务网关的Restful API"
  version: "1.0"
  description: "服务网关API 描述"
